<!-- app/spa-loading-template.html -->
<style>
    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    html {
        overflow-y: scroll;
    }

    body {
        background-color: #ffffff;
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: 'Inter', -apple-system, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
        body {
            background-color: #0a0a0f;
        }
    }

    .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        width: 200px;
        padding: 20px;
        margin-bottom: 5vh;        
    }

    .logo-wrapper {
        width: 50px;
        height: 50px;
        filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.1));
        flex-shrink: 0;
    }

    .progress-wrapper {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }

    .progress-bar-bg {
        width: 100%;
        height: 8px;
        background: rgba(99, 102, 241, 0.1);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(99, 102, 241, 0.05);
    }

    .progress-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #6366f1, #a855f7);
        border-radius: 10px;
        transition: width 0.3s ease-out;
        box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
    }

    .percentage-text {
        width: 60px;
        text-align: center;
        font-size: 14px;
        font-weight: 800;
        color: #6366f1;
        letter-spacing: 1px;
        font-variant-numeric: tabular-nums;
    }

    .loading-status {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 600;
        color: #94a3b8;
        margin-top: -4px;
    }
</style>

<div class="loading-container">
    <!-- Logo SVG CubeIcon3x3 (Logo Case) -->
    <div class="logo-wrapper">
        <svg viewBox="0 0 124 124" width="100%" height="100%">
            <g transform="translate(12, 12)">
                <!-- Top Grid -->
                <rect x="0" y="0" width="30" height="30" rx="4" fill="#11aa00" stroke="#0a0a0f" stroke-width="1.5" />
                <rect x="33" y="0" width="30" height="30" rx="4" fill="#ee8800" stroke="#0a0a0f" stroke-width="1.5" />
                <rect x="66" y="0" width="30" height="30" rx="4" fill="#2040d0" stroke="#0a0a0f" stroke-width="1.5" />

                <rect x="0" y="33" width="30" height="30" rx="4" fill="#11aa00" stroke="#0a0a0f" stroke-width="1.5" />
                <rect x="33" y="33" width="30" height="30" rx="4" fill="#ffff00" stroke="#0a0a0f" stroke-width="1.5" />
                <rect x="66" y="33" width="30" height="30" rx="4" fill="#2040d0" stroke="#0a0a0f" stroke-width="1.5" />

                <rect x="0" y="66" width="30" height="30" rx="4" fill="#d00000" stroke="#0a0a0f" stroke-width="1.5" />
                <rect x="33" y="66" width="30" height="30" rx="4" fill="#d00000" stroke="#0a0a0f" stroke-width="1.5" />
                <rect x="66" y="66" width="30" height="30" rx="4" fill="#d00000" stroke="#0a0a0f" stroke-width="1.5" />
            </g>
        </svg>
    </div>

    <div class="progress-wrapper">
        <div class="progress-bar-bg">
            <div id="loading-bar" class="progress-bar-fill"></div>
        </div>
        <div class="percentage-text"><span id="loading-percent">0</span>%</div>
    </div>
</div>

<script>
    (function () {
        const bar = document.getElementById('loading-bar');
        const text = document.getElementById('loading-percent');
        let progress = 0;

        const interval = setInterval(() => {
            if (progress < 70) {
                progress += Math.random() * 12;
            } else if (progress < 98) {
                progress += Math.random() * 1.5;
            }

            if (progress > 99) progress = 99;

            const rounded = Math.floor(progress);
            bar.style.width = rounded + '%';
            text.innerText = rounded;

            if (progress >= 99) {
                clearInterval(interval);
            }
        }, 180);

        window.addEventListener('load', () => {
            clearInterval(interval);
            bar.style.width = '100%';
            text.innerText = '100';
        });
    })();
</script>
